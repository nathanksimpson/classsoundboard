<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Soundboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="header__toprow">
      <h1 id="board-name" class="header__title" title="Click to rename">Soundboard</h1>
      <button type="button" id="header-toggle" class="btn btn--secondary header__toggle header__toggle--gear" aria-expanded="false" aria-controls="header-popout" aria-label="Settings">⚙</button>
    </div>
    <div class="header__quick">
      <div class="search" role="search">
        <input type="search" id="search-input" class="search__input" placeholder="Search sounds…" aria-label="Search">
        <button type="button" id="search-clear" class="search__clear">Clear</button>
      </div>
      <div class="header__global-volume">
        <label class="global-volume__label"><span id="global-volume-label">Volume 100%</span></label>
        <input type="range" id="global-volume" class="global-volume__slider" min="0" max="200" step="5" value="100">
      </div>
    </div>
    <div id="header-popout" class="header__popout" hidden>
      <div class="header__popout-backdrop"></div>
      <section class="header__popout-panel" role="dialog" aria-modal="true" aria-label="Settings">
        <header class="header__popout-header">
          <h2 class="header__popout-title">Settings</h2>
          <button type="button" id="header-popout-close" class="header__popout-close" aria-label="Close">✕</button>
        </header>
        <div id="toolbar" class="toolbar">
          <div class="toolbar__group">
            <button type="button" class="btn btn--primary" data-action="add">Add Sound</button>
            <button type="button" class="btn btn--secondary" data-action="add-blerp">Add from Blerp</button>
            <button type="button" class="btn btn--secondary" data-action="export">Export Board</button>
            <button type="button" class="btn btn--secondary" data-action="export-portable">Export Portable ZIP</button>
            <button type="button" class="btn btn--secondary" data-action="download-media">Download media</button>
            <button type="button" class="btn btn--secondary" data-action="reinitialize">Reinitialize sounds</button>
            <button type="button" class="btn btn--danger" data-action="clear-data">Clear All Data</button>
            <a class="btn btn--secondary" href="/logout">Sign out</a>
          </div>
          <div class="toolbar__group toolbar__group--audio-tools" aria-label="Audio tools">
            <span class="toolbar__group-label">Audio</span>
            <label class="btn btn--secondary auto-level" title="Automatically level sound volumes">
              <input type="checkbox" id="auto-level-toggle" class="auto-level__check" checked>
              <span class="auto-level__label">Auto level</span>
            </label>
            <button type="button" class="btn btn--secondary" data-action="analyze-all" title="Analyze all sounds for consistent volume (recommended once per board)">Analyze all</button>
          </div>
          <div class="import-mode" role="group" aria-label="Import mode">
            <label class="import-mode__option"><input type="radio" name="import-mode" id="import-mode-merge" value="merge" checked> Merge into board</label>
            <label class="import-mode__option"><input type="radio" name="import-mode" id="import-mode-replace" value="replace"> Replace entire board</label>
          </div>
          <input type="file" id="import-input" accept=".json,.zip,application/zip" hidden>
          <button type="button" id="import-dropzone" class="import-dropzone">Import — drop .json or .zip here, or click</button>
          <p id="status-line" class="toolbar__status toolbar__status--block" aria-live="polite"></p>
        </div>
      </section>
    </div>
  </header>

  <main class="main">
    <section id="quick-access" class="quick-access" aria-label="Quick access sounds">
      <div id="recents-section" class="quick-access__section">
        <div class="quick-access__header">
          <button type="button" id="recents-collapse-toggle" class="quick-access__toggle category__header" aria-expanded="true" aria-label="Collapse recents">
            <span class="category__title">
              <span class="category__caret quick-access__caret" aria-hidden="true">▼</span>
              <span class="quick-access__title">Recents</span>
            </span>
            <span id="recents-count" class="category__count">0 sounds</span>
          </button>
          <div class="quick-access__controls">
            <label class="quick-access__rows-control" for="recents-rows-select">
              <span>Rows</span>
              <select id="recents-rows-select" class="quick-access__rows-select" aria-label="Recent rows">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
          </div>
        </div>
        <div id="recents-strip" class="sound-strip sound-strip--recents" role="list"></div>
      </div>
      <div id="favourites-section" class="quick-access__section">
        <div class="quick-access__header">
          <button type="button" id="favourites-collapse-toggle" class="quick-access__toggle category__header" aria-expanded="true" aria-label="Collapse favourites">
            <span class="category__title">
              <span class="category__caret quick-access__caret" aria-hidden="true">▼</span>
              <span class="quick-access__title">Favourites</span>
            </span>
            <span id="favourites-count" class="category__count">0 sounds</span>
          </button>
          <div class="quick-access__controls">
            <label class="quick-access__rows-control" for="favourites-rows-select">
              <span>Rows</span>
              <select id="favourites-rows-select" class="quick-access__rows-select" aria-label="Favourite rows">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
            </label>
            <button type="button" id="favourites-reorder-toggle" class="btn btn--secondary btn--tiny">Reorder</button>
          </div>
        </div>
        <div id="favourites-strip" class="sound-strip sound-strip--favorites" role="list"></div>
      </div>
    </section>
    <div class="main__board">
      <div id="sound-grid" class="grid grid-groups" role="list"></div>
    </div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <div class="modal__backdrop"></div>
    <div class="modal__panel">
      <h2 id="modal-title" class="modal__title">Edit Sound</h2>
      <p id="modal-error" class="modal__error" aria-live="polite"></p>
      <form id="modal-form" class="modal__form">
        <label class="field"><span class="field__label">Title</span><input type="text" name="title" class="field__input" required></label>
        <label class="field">
          <span class="field__label">Audio URL</span>
          <input type="text" name="audioRef" class="field__input" placeholder="/media/audio/... or https://...">
        </label>
        <label class="field">
          <span class="field__label">Or upload your own file (MP3, WAV, etc.)</span>
          <input type="file" id="upload-audio-input" name="audioFile" class="field__input" accept="audio/*">
          <span class="field__hint" id="uploaded-audio-hint" aria-live="polite"></span>
        </label>
        <label class="field">
          <span class="field__label">Image URL</span>
          <input type="text" name="imageRef" class="field__input" placeholder="/media/images/... or https://...">
        </label>
        <label class="field">
          <span class="field__label">Category</span>
          <input type="text" name="category" class="field__input" list="category-options">
        </label>
        <div class="field">
          <span class="field__label" id="hotkey-label">Hotkey</span>
          <div class="hotkey-field">
            <input type="text" name="hotkey" id="hotkey-input" class="field__input" placeholder="Hold keys: Q, Shift+A, A+B, Shift+A+B" aria-labelledby="hotkey-label">
            <button type="button" id="hotkey-clear" class="hotkey-field__clear" aria-label="Clear hotkey">×</button>
          </div>
          <p class="field__hint hotkey-field__hint">Hold the keys, then let go. They stay in the box. Press × to clear.</p>
        </div>
        <label class="field">
          <span class="field__label">Tile color</span>
          <input type="color" name="color" class="field__input field__color" value="#4a9eff">
        </label>
        <label class="field">
          <span class="field__label">Volume <span id="volume-percent">100%</span></span>
          <input type="range" name="volume" class="field__input field__range" min="0" max="100" value="100">
        </label>
        <label class="field">
          <span class="field__label">Playback speed <span id="speed-value">1.0</span>×</span>
          <input type="range" name="playbackRate" class="field__input field__range" min="0.5" max="2" step="0.1" value="1">
        </label>
        <label class="field field--checkbox"><input type="checkbox" name="loop"> <span class="field__label">Loop</span></label>
        <label class="field field--checkbox"><input type="checkbox" name="momentary"> <span class="field__label">Momentary (hold to play)</span></label>
        <div class="field trim-field">
          <span class="field__label">Playback range</span>
          <p class="field__hint" id="duration-hint"></p>
          <div class="trim-field__row">
            <label class="field"><span class="field__label">Start (sec)</span><input type="number" name="startSec" class="field__input" min="0" step="0.01" placeholder="0"></label>
            <label class="field"><span class="field__label">End (sec)</span><input type="number" name="endSec" class="field__input" min="0" step="0.01" placeholder="full"></label>
          </div>
          <div id="trim-bar-wrap" class="trim-bar-wrap" aria-hidden="true">
            <div class="trim-bar" id="trim-bar" role="group" aria-label="Set start and end of playback">
              <div class="trim-bar__track"></div>
              <div class="trim-bar__fill" id="trim-bar-fill"></div>
              <button type="button" class="trim-bar__handle trim-bar__handle--start" id="trim-handle-start" aria-label="Start time"></button>
              <button type="button" class="trim-bar__handle trim-bar__handle--end" id="trim-handle-end" aria-label="End time"></button>
            </div>
            <div class="trim-bar__labels">
              <span id="trim-start-label">0s</span>
              <span id="trim-end-label">— s</span>
            </div>
          </div>
        </div>
        <div class="modal__actions modal__actions--wrap">
          <button type="button" class="btn btn--secondary" data-action="preview">Preview</button>
          <button type="submit" class="btn btn--primary">Save</button>
          <button type="button" class="btn btn--secondary" data-action="cancel">Cancel</button>
          <button type="button" class="btn btn--danger" data-action="delete">Delete</button>
        </div>
      </form>
    </div>
  </div>

  <div id="blerp-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="blerp-modal-title" hidden>
    <div class="modal__backdrop" data-blerp-dismiss></div>
    <div class="modal__panel modal__panel--blerp">
      <h2 id="blerp-modal-title" class="modal__title">Add from Blerp</h2>
      <p class="blerp-modal__help">On <a href="https://blerp.com" target="_blank" rel="noopener">blerp.com</a>, open a sound and copy the link from your browser address bar. Paste it below.</p>
      <p id="blerp-modal-error" class="modal__error" aria-live="polite"></p>
      <label class="field">
        <span class="field__label">Blerp sound link</span>
        <input type="url" id="blerp-url-input" class="field__input" placeholder="https://blerp.com/soundbites/" autocomplete="off" spellcheck="false">
      </label>
      <p id="blerp-modal-status" class="blerp-modal__status" aria-live="polite"></p>
      <div class="modal__actions">
        <button type="button" id="blerp-import-btn" class="btn btn--primary">Import</button>
        <button type="button" class="btn btn--secondary" data-blerp-dismiss>Cancel</button>
      </div>
    </div>
  </div>

  <datalist id="category-options"></datalist>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>
  <script src="js/schema.js"></script>
  <script src="js/repository.js"></script>
  <script src="js/merge-engine.js"></script>
  <script src="js/media-resolver.js"></script>
  <script src="js/blerp-import.js"></script>
  <script src="js/import-service.js"></script>
  <script src="js/export-service.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/hotkey-engine.js"></script>
  <script src="js/ui-renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
